<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale-1, shrink-to-fit=no" />
    <meta name="description" content="DarksideManagement" />
    <meta name="author" content="DarksideManagement" />

</head>
<body>
<section class="bg-light py-5">
<div class="container px-5 my-5 px-5">
    <div class="text-center mb-5">
        <div class="feature bg-primary bg-gradient" text-white rounded-3 mb-3><i class="bi bi-envelope"></i></div>
        <h2 class="fw-bolder">leave a note below</h2>
        <p class="lead-mb-0">need assistance?</p>
    </div>
        <div class="col-lg-6">
            <form id="messageForm">
                <div class="form-floating mb-3">
                    <input class="form-control" id="orderNumber" name="orderNumber" type="text" placeholder="Enter message here..."/>
                    <label for="oderNumber">Order Number</label>
                </div>
                <div class="form-floating mb-3">
                    <input class="form-control" id="author" name="author" type="text" placeholder="Enter your name..."/>
                    <label for="author">Author</label>
                </div>
                <div class="form-floating mb-3">
                    <textarea class="form-control" id="message" name="message" type="text" placeholder="Enter message here..."></textarea>
                    <label for="message">Message</label>
                </div>
                <div class="d-rigid"><button class="btn btn-primary btn-lg" type="submit">Submit</button></div>
            </form>
        </div>
    </div>
</div>
</section>

<script>
 document.addEventListener("DOMContentLoaded", function () {
    const messageForm = document.getElementById("messageForm");

    messageForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        const formData = new FormData(messageForm);

        const payload = {
            order: formData.get("orderNumber") || "",
            author: formData.get("author") || "",
            message: formData.get("message") || ""
        
        };
        
        if (!payload.order || !payload.author || payload.message) {
            alert("All fields required");
            return;
        }

        try {
         const res = await fetch("http://localhost:8000/api.php", {

                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            console.log(result);
        
            alert("Success");
        
        } catch (err) {
            console.error(err);
            alert("Error");
        }
    });

});
</script>


</body>
</html>
